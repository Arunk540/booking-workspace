stack:
  build: maven
  language: java
  framework: webflux

modules:
  service: service
  test: src/test/java
  componentTest: componenttest

# Exact commands — standalone module poms (no root reactor). Run verbatim.
# `clean` is MANDATORY on every compile/test here: MapStruct fails with
# "Attempt to recreate a file for type …MapperImpl" against stale generated
# sources otherwise (see lessons.md). Scope a run with `-Dtest=<Class>`.
commands:
  build:          "mvn -f service/pom.xml clean package"
  unit_test:      "mvn -f service/pom.xml clean test"
  component_test: "mvn -f componenttest/pom.xml verify -Dspring.profiles.active=local"
  lint:           "none"
  verify:         "mvn -f service/pom.xml clean verify"

features:
  kafka: true
  temporal: true
  database: mongo
  avro: true

contmark_skills:
  always:  [execution-core]
  stack:   [spring-java-conventions, java-reactive-patterns]
  build:   [maven-build-profiles]
  domain:  [kafka-consumer-patterns, temporal-workflow-patterns]
  review:  [code-review-checklist]
  test:    [unit-testing-java, component-testing-cucumber]
  pr:      [pr-delivery-and-triage]
  plan:    [plan-templates]
